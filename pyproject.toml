[project]
name = "bella-charm-agent"
version = "0.1.0"
description = "LangGraph agent that handles Instagram DM conversations for Bella Charm London."
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-groq>=0.2.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.7.0",
    "langgraph-checkpoint-sqlite>=3.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bella_charm_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = '-m "not live_llm"'
markers = [
    "live_llm: hits the real Groq API -- opt-in only, run via `pytest -m live_llm`",
]
